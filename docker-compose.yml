version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: horizon_pm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horizon_password}
      POSTGRES_DB: ${POSTGRES_DB:-horizon_pm}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U horizon -d horizon_pm']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
